pre-commit:
  parallel: true
  commands:
    # DISABLED: `brew style` fails with EACCES on
    # /opt/homebrew/Library/Homebrew/vendor/bundle/ruby/4.0.0/.homebrew_vendor_version
    # because nix-homebrew pins the entire Homebrew Library to an immutable
    # nix-store symlink (dr-xr-xr-x root wheel). `brew style` tries to write
    # a vendor-version marker file there and cannot. Incompatible with
    # nix-homebrew by design.
    # Re-enable if Homebrew is moved off nix-homebrew, or run
    # `brew style Casks/<file>.rb` manually before committing.
    # style:
    #   run: brew style {staged_files}
    #   glob: "*.rb"
    yamllint:
      run: mise exec -- yamllint --no-warnings {staged_files}
      glob: "*.{yml,yaml}"
    toml:
      run: mise exec -- taplo fmt {staged_files}
      glob: "*.toml"
    shell:
      run: mise exec -- shfmt -w {staged_files}
      glob: "*.sh"
    markdown:
      run: npx --yes prettier --write {staged_files}
      glob: "*.md"

commit-msg:
  commands:
    conventional-commits:
      run: |
        if [ -f ".git/COMMIT_EDITMSG" ]; then
          MSG=$(cat .git/COMMIT_EDITMSG)
        elif [ -f ".git/msg" ]; then
          MSG=$(cat .git/msg)
        else
          MSG=""
        fi
        if ! echo "$MSG" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)'; then
          echo "Error: Commit message does not follow"
          echo "conventional commits format."
          echo "Expected: <type>(<scope>)?<!>?: <description>"
          echo "Types: build, chore, ci, docs, feat, fix, perf,"
          echo "refactor, revert, style, test"
          exit 1
        fi
