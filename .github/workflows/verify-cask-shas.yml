name: Verify Cask SHAs
on:
  schedule:
    # Weekly: Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  verify-shas:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # dual_arch casks that are rebuilt upstream without version bumps
          - name: nuvio-desktop
            file: Casks/nuvio-desktop.rb
            url_template_arm64: "https://github.com/NuvioMedia/NuvioDesktop/releases/download/VERSION/Nuvio-macOS-arm64-VERSION.dmg"
            url_template_intel: "https://github.com/NuvioMedia/NuvioDesktop/releases/download/VERSION/Nuvio-macOS-x86_64-VERSION.dmg"
          - name: aerion
            file: Casks/aerion.rb
            url_template_arm64: "https://github.com/hkdb/aerion/releases/download/vVERSION/Aerion-darwin-arm64.zip"
            url_template_intel: "https://github.com/hkdb/aerion/releases/download/vVERSION/Aerion-darwin-amd64.zip"
          - name: input-leap
            file: Casks/input-leap.rb
            url_template_arm64: "https://github.com/input-leap/input-leap/releases/download/vVERSION/macOS-Apple_Silicon-debug-vVERSION.tar.gz"
            url_template_intel: "https://github.com/input-leap/input-leap/releases/download/vVERSION/macOS-x86_64-debug-vVERSION.tar.gz"
          - name: betterbird
            file: Casks/betterbird.rb
            url_template_arm64: "https://www.betterbird.eu/downloads/MacDiskImage/betterbird-VERSION.en-US.mac-arm64.dmg"
            url_template_intel: "https://www.betterbird.eu/downloads/MacDiskImage/betterbird-VERSION.en-US.mac.dmg"
    steps:
      - name: Checkout Tap
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.HOMEBREW_BUMP_TOKEN }}

      - name: Verify and fix SHA
        run: |
          VERSION=$(grep 'version("' ${{ matrix.file }} | head -n 1 | sed -E 's/.*version\("([^"]*)"\).*/\1/')
          echo "Checking ${{ matrix.name }} v$VERSION..."

          URL_ARM64=$(echo "${{ matrix.url_template_arm64 }}" | sed "s|VERSION|$VERSION|g")
          URL_INTEL=$(echo "${{ matrix.url_template_intel }}" | sed "s|VERSION|$VERSION|g")

          # Download and hash
          SHA_ARM64=$(curl -L -s "$URL_ARM64" | shasum -a 256 | awk '{print $1}')
          SHA_INTEL=$(curl -L -s "$URL_INTEL" | shasum -a 256 | awk '{print $1}')

          # Validate downloads
          EMPTY_SHA="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          if [ -z "$SHA_ARM64" ] || [ "$SHA_ARM64" == "$EMPTY_SHA" ]; then
            echo "Error: arm64 download failed or file is empty."
            exit 1
          fi
          if [ -z "$SHA_INTEL" ] || [ "$SHA_INTEL" == "$EMPTY_SHA" ]; then
            echo "Error: intel download failed or file is empty."
            exit 1
          fi

          # Extract current SHAs from cask file
          CURRENT_ARM64=$(perl -0777 -ne 'if (/on_arm\s+do\s+sha256\("([^"]+)"\)/s) { print $1 }' ${{ matrix.file }})
          CURRENT_INTEL=$(perl -0777 -ne 'if (/on_intel\s+do\s+sha256\("([^"]+)"\)/s) { print $1 }' ${{ matrix.file }})

          CHANGED=false

          if [ "$SHA_ARM64" != "$CURRENT_ARM64" ]; then
            echo "arm64 SHA mismatch: $CURRENT_ARM64 -> $SHA_ARM64"
            perl -i '' -0pe "s|(on_arm\s+do.*?sha256\(\")[^\"]*(\")|${1}$SHA_ARM64${2}|s" ${{ matrix.file }}
            CHANGED=true
          else
            echo "arm64 SHA OK: $SHA_ARM64"
          fi

          if [ "$SHA_INTEL" != "$CURRENT_INTEL" ]; then
            echo "intel SHA mismatch: $CURRENT_INTEL -> $SHA_INTEL"
            perl -i '' -0pe "s|(on_intel\s+do.*?sha256\(\")[^\"]*(\")|${1}$SHA_INTEL${2}|s" ${{ matrix.file }}
            CHANGED=true
          else
            echo "intel SHA OK: $SHA_INTEL"
          fi

          if [ "$CHANGED" = true ]; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add ${{ matrix.file }}
            git commit -m "fix(${{ matrix.name }}): update SHA (rebuilt upstream)"
            git fetch origin master
            git rebase origin/master
            git push origin master
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "All SHAs match. No changes needed."
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
