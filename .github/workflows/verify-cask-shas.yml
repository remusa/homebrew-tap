name: Verify Cask SHAs

# Re-pins cask sha256 values whose upstream artifact was rebuilt under the SAME
# version tag (nuvio-desktop and aerion have both done this). `update-casks.yml`
# cannot catch it: that job only commits when the upstream version CHANGES, so a
# same-tag re-upload leaves a stale sha behind and `brew bundle` fails with
# "Cask reports different checksum" until someone re-hashes by hand.
#
# The previous safety net kept a hand-written matrix of affected casks. It
# duplicated update-casks.yml, drifted from it, and skipped every cask that was
# not listed. Now the cask files are the only source of truth (see
# .github/scripts/verify-cask-shas.py), so a new cask is covered the moment it
# lands and there is no second list to keep in sync:
#   * `sha256 :no_check` (nightly builds) and `version :latest` casks are skipped
#   * non-asset URLs (GitHub `releases/latest`, landing pages) are ignored
#   * a cask is only rewritten when sha256 count == asset URL count, so the
#     positional pairing is unambiguous
#   * failed or empty downloads never produce a rewrite
#
# Runs daily rather than weekly: a same-version re-upload has no other trigger,
# and the daily cadence shrinks the broken-install window from a week to a day.
on:
  schedule:
    # Daily at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Share one group with update-casks.yml so the two never race on `git push`
# (both commit to master with the same token).
concurrency:
  group: cask-updates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: macos-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Checkout Tap
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.HOMEBREW_BUMP_TOKEN }}

      - name: Discover casks with pinned SHAs
        id: find
        run: python3 .github/scripts/verify-cask-shas.py discover

  verify-shas:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      # One runner per cask keeps a single slow upstream from hiding the others.
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout Tap
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.HOMEBREW_BUMP_TOKEN }}

      - name: Verify and fix SHA
        id: verify
        run: python3 .github/scripts/verify-cask-shas.py verify "${{ matrix.file }}" --apply

      - name: Commit and push
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Only the cask this job verified — never a blanket `git add`.
          git add "${{ matrix.file }}"
          if git diff --cached --quiet; then
            echo "Nothing staged for ${{ matrix.name }}. Skipping commit."
            exit 0
          fi
          git commit -m "fix(${{ matrix.name }}): update SHA (rebuilt upstream)"
          git fetch origin master
          git rebase origin/master
          git push origin master
